[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["npm install -g pnpm", "pnpm install --frozen-lockfile"]

[phases.build]
cmds = ["NODE_OPTIONS='--max-old-space-size=4096' pnpm build"]

[start]
cmd = "node_modules/.bin/drizzle-kit push --config=drizzle.config.ts && node build/index.js"